<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WealthSim Terminal - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        input[type="checkbox"] { accent-color: #2563eb; width: 16px; height: 16px; cursor: pointer; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        #tvchart { touch-action: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col h-[100dvh] font-sans overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-slate-200 h-14 flex items-center justify-between px-3 md:px-4 shrink-0 shadow-sm z-20">
        <div class="flex items-center gap-2 md:gap-6">
            <h1 class="text-lg md:text-xl font-bold text-slate-900 flex items-center gap-2">
                <span class="bg-blue-600 text-white p-1 rounded text-sm md:text-base">WS</span> 
                <span class="hidden sm:inline">WealthSim</span>
            </h1>
            <nav class="hidden lg:flex gap-4 text-sm font-medium text-slate-500">
                <a href="#" class="text-blue-600 border-b-2 border-blue-600 py-4">Trade</a>
                <a href="#" class="hover:text-slate-900 py-4">Portfolio</a>
            </nav>
        </div>
        
        <!-- Search Bar -->
        <div class="flex-1 max-w-xs md:max-w-md mx-2">
            <div class="bg-slate-100 rounded-full flex items-center px-3 py-1.5 border border-transparent focus-within:border-blue-400 focus-within:bg-white transition">
                <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input id="symbol-input" type="text" value="NSE:NIFTY50-INDEX" class="bg-transparent border-none text-slate-700 text-xs md:text-sm focus:outline-none w-full ml-2 font-bold uppercase">
                <button id="load-symbol-btn" class="text-blue-600 hover:text-blue-800 text-xs font-bold px-1">LOAD</button>
            </div>
        </div>

        <div class="flex items-center gap-2 md:gap-4 text-sm font-bold">
            <div class="bg-slate-100 rounded-full h-7 w-7 md:h-8 md:w-8 flex items-center justify-center text-slate-600 text-xs">AK</div>
            <div class="text-slate-600 hidden md:block">Paper Trading</div>
        </div>
    </header>

    <!-- Main Workspace (Chart now takes full width) -->
    <div class="flex flex-col flex-1 relative z-0">
        
        <!-- Chart Header -->
        <div class="h-10 bg-white border-b border-slate-200 flex items-center px-2 md:px-4 gap-2 md:gap-4 text-xs md:text-sm text-slate-600 shrink-0 z-10">
            <span id="active-symbol-display" class="font-bold text-slate-900">NIFTY 50</span>
            <div class="h-4 w-[1px] bg-slate-300"></div>
            <div class="flex gap-1 md:gap-2 font-medium">
                <span class="text-blue-600 bg-blue-50 px-2 py-0.5 rounded cursor-pointer">1m</span>
                <span class="hover:bg-slate-100 px-2 py-0.5 rounded cursor-pointer">5m</span>
            </div>
        </div>

        <!-- Chart Container -->
        <div id="tvchart" class="flex-1 bg-white relative">
            <!-- HTML Box for PnL -->
            <div id="pnl-floating-box" class="absolute hidden z-10 text-[11px] md:text-xs font-bold px-2 py-1 rounded shadow-md transform -translate-y-1/2 left-4 transition-colors"></div>
        </div>
        
        <!-- 👇 NAYA: Floating Action Button (TRADE) 👇 -->
        <button id="fab-order" class="absolute bottom-20 md:bottom-24 right-4 md:right-6 bg-blue-600 hover:bg-blue-700 text-white shadow-xl px-5 py-3 rounded-full font-bold flex items-center gap-2 z-30 transform hover:scale-105 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            TRADE
        </button>
    </div>

    <!-- 👇 NAYA: Sliding Order Panel (Right Side) 👇 -->
    <!-- Backdrop (blur parda) -->
    <div id="order-backdrop" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-40 hidden transition-opacity"></div>
    
    <!-- Right Panel -->
    <div id="order-sidebar" class="fixed top-0 right-0 h-full w-full sm:w-[360px] bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        
        <!-- Header -->
        <div class="flex justify-between items-center p-3 md:p-4 border-b border-slate-200 bg-slate-50 shrink-0">
            <div class="flex items-center gap-3">
                <!-- Close Button -->
                <button id="close-order-btn" class="text-slate-400 hover:text-slate-800 transition p-1 bg-white rounded shadow-sm border border-slate-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
                <span class="font-bold text-slate-800 text-base">Order Window</span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[10px] md:text-xs text-slate-500">Live Price</span>
                <span class="text-slate-900 font-bold text-base md:text-lg" id="ltp">0.00</span>
            </div>
        </div>

        <div class="flex text-xs md:text-sm font-semibold border-b border-slate-200 mx-3 md:mx-4 mt-2 shrink-0">
            <div id="tab-market" class="flex-1 text-center py-2 border-b-2 border-blue-600 text-blue-600 cursor-pointer">Market</div>
            <div id="tab-limit" class="flex-1 text-center py-2 text-slate-400 border-b-2 border-transparent cursor-pointer hover:text-slate-700">Limit</div>
        </div>

        <div class="p-3 md:p-4 flex flex-col gap-4 overflow-y-auto flex-1">
            <div class="flex gap-2 p-1 bg-slate-100 rounded-lg">
                <button id="toggle-buy" class="flex-1 py-1.5 md:py-2 rounded-md font-bold text-xs md:text-sm bg-green-500 text-white shadow-sm transition">BUY</button>
                <button id="toggle-sell" class="flex-1 py-1.5 md:py-2 rounded-md font-bold text-xs md:text-sm text-slate-500 hover:bg-slate-200 transition">SELL</button>
            </div>

            <div id="limit-price-container" class="hidden flex-col gap-1">
                <label class="text-xs font-semibold text-slate-500">Limit Price (₹)</label>
                <input id="limit-price-input" type="number" class="w-full bg-white border border-slate-300 rounded p-1.5 md:p-2 outline-none focus:border-blue-500 text-slate-900 font-bold text-sm">
            </div>

            <div class="flex flex-col gap-1">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-semibold text-slate-500">Quantity</label>
                </div>
                <div class="flex items-center border border-slate-300 rounded overflow-hidden h-9 md:h-10">
                    <button id="qty-minus" class="px-4 text-slate-500 hover:bg-slate-100 text-lg font-bold border-r border-slate-300 h-full transition bg-slate-50">-</button>
                    <input id="qty-input" type="number" value="50" class="w-full text-center bg-white border-none outline-none font-bold text-slate-900 h-full text-sm">
                    <button id="qty-plus" class="px-4 text-slate-500 hover:bg-slate-100 text-lg font-bold border-l border-slate-300 h-full transition bg-slate-50">+</button>
                </div>
            </div>

            <div class="flex flex-col gap-3 mt-1 border-t border-slate-100 pt-3">
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="sl-toggle">
                    <div class="flex-1">
                        <label class="text-xs font-semibold text-slate-600 block">Stop Loss</label>
                        <input id="sl-input" type="number" placeholder="Trigger Price" class="w-full mt-1 bg-white border border-slate-300 rounded p-1.5 md:p-2 outline-none focus:border-blue-500 text-slate-900 font-bold opacity-50 pointer-events-none transition text-xs md:text-sm">
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="tp-toggle">
                    <div class="flex-1">
                        <label class="text-xs font-semibold text-slate-600 block">Target</label>
                        <input id="tp-input" type="number" placeholder="Target Price" class="w-full mt-1 bg-white border border-slate-300 rounded p-1.5 md:p-2 outline-none focus:border-blue-500 text-slate-900 font-bold opacity-50 pointer-events-none transition text-xs md:text-sm">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="p-3 md:p-4 border-t border-slate-200 bg-slate-50 shrink-0">
            <button id="place-order-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg text-sm font-bold shadow-md transition">Place Paper Order</button>
        </div>
    </div>

    <!-- Bottom Drawer for Positions (Unchanged, remains at bottom) -->
    <div id="positions-drawer" class="fixed bottom-0 left-0 w-full bg-white border-t border-slate-300 z-40 transition-transform duration-300 ease-in-out transform translate-y-[calc(100%-48px)] flex flex-col h-[60vh] md:h-[35vh] shadow-[0_-10px_20px_rgba(0,0,0,0.1)] rounded-t-xl md:rounded-none">
        
        <div id="drawer-toggle" class="h-12 flex items-center justify-center bg-slate-100 hover:bg-slate-200 cursor-pointer rounded-t-xl md:rounded-none shrink-0 relative border-b border-slate-200">
            <div class="w-12 h-1.5 bg-slate-400 rounded-full"></div>
            
            <div class="absolute left-4 flex items-center gap-2">
                <span class="text-xs md:text-sm font-bold text-slate-700">Live Positions</span>
                <span id="drawer-live-pnl" class="text-[10px] md:text-xs font-bold text-slate-400 bg-white px-2 py-0.5 rounded border border-slate-200">₹0.00</span>
            </div>
            
            <div class="absolute right-4 text-slate-500">
                <svg id="drawer-arrow" class="w-5 h-5 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
            </div>
        </div>

        <div class="flex flex-col flex-1 overflow-hidden bg-white">
            <div class="flex border-b border-slate-200 px-2 text-xs md:text-sm font-semibold text-slate-500 shrink-0">
                <button id="tab-positions" class="px-4 py-2 text-blue-600 border-b-2 border-blue-600">Active</button>
                <button id="tab-history" class="px-4 py-2 hover:text-slate-900 border-b-2 border-transparent">History</button>
                <div class="ml-auto flex items-center pr-2 text-xs font-bold text-slate-600">
                    Bal: <span id="wallet-balance" class="ml-1 text-slate-900">₹100k</span>
                </div>
            </div>

            <div class="flex-1 overflow-auto">
                <table id="positions-table" class="w-full text-left text-xs md:text-sm text-slate-600 whitespace-nowrap">
                    <thead class="bg-slate-50 text-slate-400 sticky top-0 border-b border-slate-200">
                        <tr>
                            <th class="p-2 md:p-3 font-medium">Symbol</th>
                            <th class="p-2 md:p-3 font-medium">Type</th>
                            <th class="p-2 md:p-3 font-medium">Qty</th>
                            <th class="p-2 md:p-3 font-medium">Avg</th>
                            <th class="p-2 md:p-3 font-medium">LTP</th>
                            <th class="p-2 md:p-3 font-medium">PnL</th>
                            <th class="p-2 md:p-3 font-medium">Act</th>
                        </tr>
                    </thead>
                    <tbody id="positions-container-table">
                        <tr><td colspan="7" class="text-center p-4 text-slate-400">No active positions</td></tr>
                    </tbody>
                </table>

                <table id="history-table" class="w-full text-left text-xs md:text-sm text-slate-600 whitespace-nowrap hidden">
                    <thead class="bg-slate-50 text-slate-400 sticky top-0 border-b border-slate-200">
                        <tr>
                            <th class="p-2 md:p-3 font-medium">Time</th>
                            <th class="p-2 md:p-3 font-medium">Symbol</th>
                            <th class="p-2 md:p-3 font-medium">Type</th>
                            <th class="p-2 md:p-3 font-medium">Qty</th>
                            <th class="p-2 md:p-3 font-medium">Entry</th>
                            <th class="p-2 md:p-3 font-medium">Exit</th>
                            <th class="p-2 md:p-3 font-medium">PnL</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body">
                        <tr><td colspan="7" class="text-center p-4 text-slate-400">Loading trades...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
